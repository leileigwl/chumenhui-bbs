<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>楚门会 — AI 实战社区</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
      background: #18120D;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .phone-shell {
      width: 390px;
      height: 844px;
      overflow: hidden;
      position: relative;
      border-radius: 42px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06),
        0 0 0 10px #1A1209,
        0 0 0 11px rgba(255,255,255,0.04),
        0 40px 90px rgba(0,0,0,0.7);
      background: #F8F5F0;
    }
    #root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }
    @keyframes cmSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    ::-webkit-scrollbar { width: 0; height: 0; }
    * { scrollbar-width: none; }
    input, textarea, button { font-family: inherit; }
    @media (max-width: 430px) {
      body { background: #F8F5F0; padding: 0; align-items: flex-start; }
      .phone-shell {
        width: 100vw; height: 100svh;
        border-radius: 0;
        box-shadow: none;
      }
    }
    * { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  </style>

  <script>
    var TWEAK_DEFAULTS = {
      "accentColor": "#C95B15",
      "showHotList": true
    };
  </script>
</head>
<body>
  <div class="phone-shell">
    <div id="root"></div>
  </div>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin="anonymous"></script>

  <script src="/legacy/data.js"></script>
  <script type="text/babel" src="/legacy/tweaks-panel.jsx"></script>
  <script type="text/babel" src="/legacy/features.jsx"></script>
  <script type="text/babel" src="/legacy/settings.jsx"></script>
  <script type="text/babel" src="/legacy/components.jsx"></script>
  <script type="text/babel" src="/legacy/app.jsx"></script>
</body>
</html>
